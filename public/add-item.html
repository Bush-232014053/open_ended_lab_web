<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Item - Campus Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbarArea"></div>

  <main id="mainContent" class="container my-4" tabindex="-1">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="form-page">
          <h1 class="h2">Add New Item</h1>
          <p>List something you own so other students/staff can borrow it.</p>

          <div id="alertBox" style="display:none;"></div>

          <form id="itemForm">
            <div class="mb-3">
              <label class="form-label" for="title">Item name</label>
              <input id="title" type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="description">Description</label>
              <textarea id="description" name="description" class="form-control" rows="4" required></textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="category">Category</label>
                <select id="category" name="category" class="form-select">
                  <option value="tools">Tools</option>
                  <option value="electronics">Electronics</option>
                  <option value="textbooks">Textbooks</option>
                  <option value="lab-kits">Lab Kits</option>
                  <option value="cameras">Cameras</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="condition_note">Condition</label>
                <select id="condition_note" name="condition_note" class="form-select">
                  <option value="new">New</option>
                  <option value="like-new">Like new</option>
                  <option value="good" selected>Good</option>
                  <option value="fair">Fair</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="location">Pickup location (campus)</label>
              <input id="location" type="text" name="location" class="form-control" placeholder="e.g. Hardware Lab" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="image">Photo (optional)</label>
              <input id="image" type="file" name="image" class="form-control" accept="image/*">
            </div>
            <button class="btn btn-primary" type="submit">Save Item</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footerArea"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    requireLogin().then(function () {
      loadNavbar("add item");
      loadFooter();
    });

    document.getElementById("itemForm").onsubmit = async function (e) {
      e.preventDefault();
      const form = new FormData(e.target);
      try {
        const res = await fetch("/api/items", {
          method: "POST",
          credentials: "include",
          body: form
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not save");
        window.location.href = "item.html?id=" + data.item.id;
      } catch (err) {
        showAlert("alertBox", err.message, "danger");
      }
    };
  </script>
</body>
</html>
