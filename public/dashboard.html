<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Campus Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbarArea"></div>

  <main id="mainContent" class="container my-4" tabindex="-1">
    <h1 class="h2">Dashboard</h1>
    <p id="welcome"></p>

    <h2 class="h4 mt-4">Requests for my items</h2>
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <caption class="visually-hidden">Incoming borrow requests</caption>
        <thead class="table-primary">
          <tr>
            <th scope="col">Item</th>
            <th scope="col">Borrower</th>
            <th scope="col">Dates</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody id="incomingTable"></tbody>
      </table>
    </div>

    <h2 class="h4 mt-4">My borrow requests</h2>
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <caption class="visually-hidden">Outgoing borrow requests</caption>
        <thead class="table-info">
          <tr>
            <th scope="col">Item</th>
            <th scope="col">Owner</th>
            <th scope="col">Dates</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody id="outgoingTable"></tbody>
      </table>
    </div>

    <h2 class="h4 mt-4">My listed items <a href="add-item.html" class="btn btn-sm btn-primary">Add Item</a></h2>
    <div class="row" id="myItems"></div>
  </main>

  <div id="footerArea"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function doAction(id, action) {
      await apiCall("/api/borrows/" + id, "PATCH", { action: action });
      loadDashboard();
    }

    function actionButtons(req, incoming) {
      if (incoming && req.status === "pending") {
        return '<button type="button" class="btn btn-sm btn-success me-1" onclick="doAction(' + req.id + ',\'approve\')">Accept ' + escapeHtml(req.title) + '</button>' +
          '<button type="button" class="btn btn-sm btn-outline-danger" onclick="doAction(' + req.id + ',\'reject\')">Reject ' + escapeHtml(req.title) + '</button>';
      }
      if (incoming && req.status === "approved") {
        return '<button type="button" class="btn btn-sm btn-primary" onclick="doAction(' + req.id + ',\'return\')">Mark ' + escapeHtml(req.title) + ' returned</button>';
      }
      if (!incoming && req.status === "pending") {
        return '<button type="button" class="btn btn-sm btn-outline-secondary" onclick="doAction(' + req.id + ',\'cancel\')">Cancel request for ' + escapeHtml(req.title) + '</button>';
      }
      return "-";
    }

    async function loadDashboard() {
      const user = await requireLogin();
      if (!user) return;
      await loadNavbar("dashboard");
      loadFooter();

      document.getElementById("welcome").innerText =
        "Logged in as " + user.full_name + " (" + user.role + ", " + user.department + ")";

      const incoming = await apiCall("/api/borrows/incoming");
      const outgoing = await apiCall("/api/borrows/outgoing");
      const mine = await apiCall("/api/items/mine");

      let inHtml = "";
      if (incoming.requests.length === 0) {
        inHtml = '<tr><td colspan="5">No requests yet.</td></tr>';
      } else {
        for (let i = 0; i < incoming.requests.length; i++) {
          const r = incoming.requests[i];
          inHtml +=
            "<tr><td>" + escapeHtml(r.title) + "</td><td>" + escapeHtml(r.borrower_name) +
            "</td><td>" + formatDate(r.start_date) + " to " + formatDate(r.due_date) +
            "</td><td>" + statusBadge(r.status) + "</td><td>" + actionButtons(r, true) + "</td></tr>";
        }
      }
      document.getElementById("incomingTable").innerHTML = inHtml;

      let outHtml = "";
      if (outgoing.requests.length === 0) {
        outHtml = '<tr><td colspan="5">You did not request any item yet.</td></tr>';
      } else {
        for (let i = 0; i < outgoing.requests.length; i++) {
          const r = outgoing.requests[i];
          outHtml +=
            "<tr><td>" + escapeHtml(r.title) + "</td><td>" + escapeHtml(r.owner_name) +
            "</td><td>" + formatDate(r.start_date) + " to " + formatDate(r.due_date) +
            "</td><td>" + statusBadge(r.status) + "</td><td>" + actionButtons(r, false) + "</td></tr>";
        }
      }
      document.getElementById("outgoingTable").innerHTML = outHtml;

      let mineHtml = "";
      if (mine.items.length === 0) {
        mineHtml = "<p>You have not added any item yet.</p>";
      } else {
        for (let i = 0; i < mine.items.length; i++) {
          const item = mine.items[i];
          mineHtml +=
            '<div class="col-md-4 mb-3"><div class="card item-card">' +
            imgTag(item) +
            '<div class="card-body"><h3 class="h5">' + escapeHtml(item.title) + "</h3>" +
            statusBadge(item.status) +
            '<br><a class="btn btn-sm btn-outline-primary mt-2" href="item.html?id=' + item.id + '">Open ' + escapeHtml(item.title) + "</a>" +
            "</div></div></div>";
        }
      }
      document.getElementById("myItems").innerHTML = mineHtml;
    }

    loadDashboard();
  </script>
</body>
</html>
