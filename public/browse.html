<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Items - Campus Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbarArea"></div>

  <main id="mainContent" class="container my-4" tabindex="-1">
    <h1 class="h2">Browse Items</h1>
    <p>Search tools, electronics, textbooks and other equipment listed by campus users.</p>

    <form id="filterForm" class="row g-2 mb-4 filter-bar">
      <div class="col-md-5">
        <label class="form-label" for="q">Search</label>
        <input id="q" type="text" name="q" class="form-control" placeholder="Name or location">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="category">Category</label>
        <select id="category" name="category" class="form-select">
          <option value="all">All categories</option>
          <option value="tools">Tools</option>
          <option value="electronics">Electronics</option>
          <option value="textbooks">Textbooks</option>
          <option value="lab-kits">Lab Kits</option>
          <option value="cameras">Cameras</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label" for="status">Status</label>
        <select id="status" name="status" class="form-select">
          <option value="all">All status</option>
          <option value="available">Available</option>
          <option value="pending">Pending</option>
          <option value="borrowed">Borrowed</option>
        </select>
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" type="submit">Search</button>
      </div>
    </form>

    <div class="row" id="itemList"></div>
  </main>

  <div id="footerArea"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    loadNavbar("browse");
    loadFooter();

    async function loadItems() {
      const form = new FormData(document.getElementById("filterForm"));
      const params = new URLSearchParams(Object.fromEntries(form.entries()));
      const data = await apiCall("/api/items?" + params.toString());
      const box = document.getElementById("itemList");

      if (data.items.length === 0) {
        box.innerHTML = "<p>No items found.</p>";
        return;
      }

      let html = "";
      for (let i = 0; i < data.items.length; i++) {
        const item = data.items[i];
        html +=
          '<div class="col-md-4 mb-4">' +
          '<div class="card h-100 item-card">' +
          imgTag(item) +
          '<div class="card-body">' +
          "<h2 class='h5'>" + escapeHtml(item.title) + "</h2>" +
          "<p>" + escapeHtml(categoryName(item.category)) + " | " + statusBadge(item.status) + "</p>" +
          '<p class="text-muted">' + escapeHtml(item.location) + "<br>Owner: " + escapeHtml(item.owner_name) + "</p>" +
          '<a href="item.html?id=' + item.id + '" class="btn btn-sm btn-primary" aria-label="Details of ' + escapeHtml(item.title) + '">View details</a>' +
          "</div></div></div>";
      }
      box.innerHTML = html;
    }

    document.getElementById("filterForm").onsubmit = function (e) {
      e.preventDefault();
      loadItems();
    };

    document.getElementById("q").addEventListener("input", loadItems);
    document.getElementById("category").addEventListener("change", loadItems);
    document.getElementById("status").addEventListener("change", loadItems);

    loadItems();
  </script>
</body>
</html>
