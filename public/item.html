<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Details - Campus Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbarArea"></div>

  <main id="mainContent" class="container my-4" tabindex="-1">
    <p>Loading...</p>
  </main>

  <div id="footerArea"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadItem() {
      const user = await loadNavbar();
      loadFooter();

      const data = await apiCall("/api/items/" + getQuery("id"));
      const item = data.item;
      document.title = item.title + " - Campus Library";

      const canBorrow = user && user.id !== item.owner_id && item.status === "available";
      let extra = "";

      if (canBorrow) {
        extra =
          '<h2 class="h5 mt-4">Request to borrow</h2>' +
          '<div id="alertBox" style="display:none;"></div>' +
          '<form id="borrowForm">' +
          '<div class="mb-2"><label for="start_date">Start date</label><input id="start_date" type="date" name="start_date" class="form-control" required></div>' +
          '<div class="mb-2"><label for="due_date">Return date</label><input id="due_date" type="date" name="due_date" class="form-control" required></div>' +
          '<div class="mb-2"><label for="message">Message</label><textarea id="message" name="message" class="form-control" rows="3" placeholder="Why do you need this item?"></textarea></div>' +
          '<button class="btn btn-primary" type="submit">Send Request</button>' +
          "</form>";
      } else if (!user) {
        extra = '<div class="alert alert-warning mt-3">Please <a href="login.html">login</a> first to request this item.</div>';
      } else if (user.id === item.owner_id) {
        extra = '<div class="alert alert-secondary mt-3">This is your own item.</div>';
      } else {
        extra = '<div class="alert alert-secondary mt-3">This item is not available right now.</div>';
      }

      document.getElementById("mainContent").innerHTML =
        '<div class="row">' +
        '<div class="col-md-6 mb-3">' + imgTag(item, "img-fluid border item-img") + "</div>" +
        '<div class="col-md-6">' +
        "<h1 class='h2'>" + escapeHtml(item.title) + "</h1>" +
        "<p>" + statusBadge(item.status) + " &nbsp; " + escapeHtml(categoryName(item.category)) + " | Condition: " + escapeHtml(item.condition_note) + "</p>" +
        "<p>" + escapeHtml(item.description) + "</p>" +
        "<table class='table table-bordered'>" +
        "<caption class='visually-hidden'>Item details</caption>" +
        "<tr><th scope='row'>Pickup location</th><td>" + escapeHtml(item.location) + "</td></tr>" +
        "<tr><th scope='row'>Owner</th><td>" + escapeHtml(item.owner_name) + " (" + escapeHtml(item.owner_role) + ")</td></tr>" +
        "<tr><th scope='row'>Department</th><td>" + escapeHtml(item.owner_department) + "</td></tr>" +
        "</table>" +
        extra +
        "</div></div>";

      const form = document.getElementById("borrowForm");
      if (form) {
        form.onsubmit = async function (e) {
          e.preventDefault();
          const body = Object.fromEntries(new FormData(form).entries());
          try {
            await apiCall("/api/borrows/" + item.id, "POST", body);
            window.location.href = "dashboard.html";
          } catch (err) {
            showAlert("alertBox", err.message, "danger");
          }
        };
      }
    }

    loadItem().catch(function (err) {
      document.getElementById("mainContent").innerHTML = '<p class="text-danger" role="alert">' + err.message + "</p>";
    });
  </script>
</body>
</html>
