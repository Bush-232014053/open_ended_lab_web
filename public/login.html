<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campus Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbarArea"></div>

  <main id="mainContent" class="container my-5" tabindex="-1">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="form-page">
          <h1 class="h2">Login</h1>
          <p>Use your campus library account.</p>

          <div id="alertBox" style="display:none;"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input id="email" type="email" name="email" class="form-control" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <p class="mt-3">Don't have an account? <a href="register.html">Register here</a></p>

          <div class="alert alert-secondary mt-3 mb-0">
            Test accounts:<br>
            student@ulab.edu.bd / Student123<br>
            staff@ulab.edu.bd / Staff123
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footerArea"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    loadNavbar();
    loadFooter();

    document.getElementById("loginForm").onsubmit = async function (e) {
      e.preventDefault();
      const form = new FormData(e.target);
      try {
        await apiCall("/api/auth/login", "POST", Object.fromEntries(form.entries()));
        window.location.href = "dashboard.html";
      } catch (err) {
        showAlert("alertBox", err.message, "danger");
      }
    };
  </script>
</body>
</html>
