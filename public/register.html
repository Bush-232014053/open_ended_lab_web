<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campus Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbarArea"></div>

  <main id="mainContent" class="container my-5" tabindex="-1">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="form-page">
          <h1 class="h2">Register</h1>
          <p>This website is for ULAB students and staff only.</p>

          <div id="alertBox" style="display:none;"></div>

          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label" for="full_name">Full Name</label>
              <input id="full_name" type="text" name="full_name" class="form-control" autocomplete="name" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" type="email" name="email" class="form-control" autocomplete="email" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" type="password" name="password" class="form-control" minlength="6" autocomplete="new-password" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="role">I am a</label>
                <select id="role" name="role" class="form-select">
                  <option value="student">Student</option>
                  <option value="staff">Staff</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="campus_id">Student / Staff ID</label>
                <input id="campus_id" type="text" name="campus_id" class="form-control" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="department">Department</label>
              <input id="department" type="text" name="department" class="form-control" placeholder="CSE" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="phone">Phone (optional)</label>
              <input id="phone" type="text" name="phone" class="form-control" autocomplete="tel">
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footerArea"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    loadNavbar();
    loadFooter();

    document.getElementById("registerForm").onsubmit = async function (e) {
      e.preventDefault();
      const form = new FormData(e.target);
      try {
        await apiCall("/api/auth/register", "POST", Object.fromEntries(form.entries()));
        window.location.href = "dashboard.html";
      } catch (err) {
        showAlert("alertBox", err.message, "danger");
      }
    };
  </script>
</body>
</html>
